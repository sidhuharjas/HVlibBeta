title: HiveVision
description: Camera-based detection and Weaver path routing for FTC robots.

# Rewrites links like [calibration.md](calibration.md) to the .html page Pages serves.
plugins:
  - jekyll-relative-links

# Sidebar navigation, rendered by _layouts/default.html.
nav:
  - title: Overview
    url: /
  - title: Module reference
    url: /MODULES.html
  - title: Calibration
    url: /calibration.html

examples:
  - title: Auto ball hunt
    url: /examples/AutoBallHuntOpMode.java
  - title: Manual ball chase
    url: /examples/ManualBallChaseOpMode.java
  - title: Follower factory
    url: /examples/SampleFollowerFactory.java

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
